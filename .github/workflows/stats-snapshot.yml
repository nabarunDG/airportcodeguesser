name: Snapshot usage stats

# Purely informational — queries the `visits` table (see
# migrations/0002_visits.sql) and commits a fresh stats/daily-usage.json
# snapshot. Nothing in the shipped app reads this file; it's here so the
# numbers are browsable on GitHub without touching the Cloudflare dashboard.
# Requires two repo secrets: CLOUDFLARE_API_TOKEN (D1 read access) and
# CLOUDFLARE_ACCOUNT_ID.

on:
  schedule:
    # 00:20 UTC daily — shortly after midnight, so the prior UTC day's
    # numbers are effectively final by the time this runs.
    - cron: '20 0 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Query D1 for usage stats
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@3 d1 execute gatecheck-leaderboard --remote --json \
            --command "SELECT day, COUNT(DISTINCT player_id) AS unique_users, SUM(seconds) AS total_seconds, ROUND(CAST(SUM(seconds) AS REAL) / COUNT(DISTINCT player_id), 1) AS avg_seconds_per_user FROM visits GROUP BY day ORDER BY day" \
            > /tmp/raw.json

      - name: Write stats/daily-usage.json
        run: |
          mkdir -p stats
          jq '.[0].results' /tmp/raw.json > stats/daily-usage.json

      - name: Commit if changed
        run: |
          if git diff --quiet -- stats/daily-usage.json; then
            echo "No change in the stats snapshot — nothing to commit."
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add stats/daily-usage.json
            git commit -m "chore: update daily usage stats snapshot"
            git push
          fi
